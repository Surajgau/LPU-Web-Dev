<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>


  <style>

    /* Base card styling */
.pricing-card {
  background: #ffffff;
  border: 1px solid #e0e0e0;
  border-radius: 12px;
  padding: 30px;
  width: 300px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  position: relative;
  overflow: hidden;
}

/* Pseudo-Class: :hover - Elevates card on mouseover */
.pricing-card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 25px rgba(0,0,0,0.15);
}

/* Pseudo-Element: ::before - Decorative top accent border */
.pricing-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  height: 6px;
  width: 100%;
  background: linear-gradient(90deg, #ff7e5f, #feb47b);
}

/* Pseudo-Element: ::after - Watermark background effect */
.pricing-card::after {
  content: 'PRO';
  position: absolute;
  bottom: -20px;
  right: -10px;
  font-size: 100px;
  font-weight: bold;
  color: rgba(0, 0, 0, 0.03);
  z-index: 0;
}

/* Badge styling using pseudo-class :nth-child or direct class */
.badge {
  background: #ff7e5f;
  color: white;
  padding: 4px 12px;
  font-size: 12px;
  border-radius: 20px;
  text-transform: uppercase;
  font-weight: bold;
}

/* Feature list styling */
.features {
  list-style: none;
  padding: 0;
  margin: 20px 0;
  position: relative;
  z-index: 1;
}

/* Pseudo-Element: ::before - Custom checkmark bullets for list items */
.features li::before {
  content: '✓ ';
  color: #ff7e5f;
  font-weight: bold;
  margin-right: 8px;
}

/* Pseudo-Class: :not() and :first-child / :last-child structuring */
.features li:not(:last-child) {
  margin-bottom: 10px;
}

/* Button styling */
.cta-btn {
  width: 100%;
  padding: 12px;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  transition: background 0.2s ease;
  position: relative;
  z-index: 1;
}

/* Pseudo-Class: :hover and :active on Button */
.cta-btn:hover {
  background: #ff7e5f;
}

.cta-btn:active {
  transform: scale(0.98);
}

  </style>
</head>
<body>
  <div class="pricing-card">
  <span class="badge">Popular</span>
  <h2>Pro Plan</h2>
  <p class="price">$29/month</p>
  <ul class="features">
    <li>Unlimited Projects</li>
    <li>Priority Support</li>
    <li>Advanced Analytics</li>
  </ul>
  <button class="cta-btn">Choose Plan</button>
</div>

</body>
</html>
